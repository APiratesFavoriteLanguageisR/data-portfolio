gcp:
  project_id: "your-gcp-project-id"
  dataset_id: "portfolio_nyc_taxi"
  table_id: "yellow_trips"

source:
  bq_public_table: "bigquery-public-data.new_york_taxi_trips.tlc_yellow_trips_2022"
  start_date: "2022-01-01"
  end_date: "2022-01-31"

runtime:
  write_disposition: "WRITE_TRUNCATE"
  log_level: "INFO"

transform:
  datetime_columns:
    - "pickup_datetime"
    - "dropoff_datetime"

  required_columns:
    - "pickup_datetime"
    - "dropoff_datetime"
    - "passenger_count"
    - "trip_distance"

  numeric_columns:
    - "fare_amount"
    - "passenger_count"
    - "trip_distance"

  drop_columns:
    - "store_and_fwd_flag"
    - "ratecode_id"

filename:
  raw: "raw_yellow_trips_{start_date}_to_{end_date}.parquet"
  staging: "stg_yellow_trips_{start_date}_to_{end_date}.parquet"
  mart: "mart_yellow_trips_{start_date}_to_{end_date}.parquet"

output:
  output_path: "test_path/etl-nyc-taxi-pipeline/"

parquet_engine: "pyarrow"